name: Sync inactive profile data
on:
  push:
    paths:
      - '.github/workflows/sync-inactive-profile.yml'
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Sync verified service dataset
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p = Path('profile-inactive.html')
          s = p.read_text(encoding='utf-8')
          s = s.replace('<b>7 подтверждено</b>', '<b>15 подтверждено</b>')
          start = s.index('<section class="card" id="services">')
          end = s.index('</section>', start) + len('</section>')
          replacement = '''<section class="card" id="services"><div class="section-actions"><div><small class="kicker">УСЛУГИ И ТОВАРЫ</small><h2>Подтверждённые направления</h2></div><span class="availability">15 направлений в профиле</span></div><p class="muted intro">Показаны только направления, уже зафиксированные в данных стенда. Неподтверждённые позиции не добавляются.</p><div class="service-groups"><article class="service-group"><div class="service-icon" aria-hidden="true">01</div><div><h3>Медицинский центр</h3><ul class="service-list"><li>Индивидуальное изготовление стелек</li><li>Компьютерная диагностика стоп</li><li>Консультация ортопеда</li><li>Консультация флеболога</li><li>Тейпирование</li></ul></div></article><article class="service-group"><div class="service-icon" aria-hidden="true">02</div><div><h3>Ортопедические товары</h3><ul class="service-list"><li>Бандажи</li><li>Изделия для позвоночника</li><li>Изделия для суставов</li><li>Компрессионный трикотаж</li><li>Ортопедическая обувь</li><li>Ортопедические подушки</li><li>Ортопедические стельки</li></ul></div></article><article class="service-group"><div class="service-icon" aria-hidden="true">03</div><div><h3>Средства реабилитации</h3><ul class="service-list"><li>Товары для инвалидов</li><li>Трости, костыли и ходунки</li></ul></div></article><article class="service-group wide"><div class="service-icon" aria-hidden="true">04</div><div><h3>Услуги</h3><ul class="service-list"><li>Педикюр</li></ul><p>Наличие конкретной позиции уточняется в выбранном филиале.</p></div></article></div><div class="note"><b>Поведение шаблона:</b> категории и направления строятся из подтверждённых данных. Если список расширится, новые позиции появятся без изменения логики профиля.</div></section>'''
          s = s[:start] + replacement + s[end:]
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit and remove temporary workflow
        run: |
          git config user.name 'Yumis84'
          git config user.email '52785831+Yumis84@users.noreply.github.com'
          git add profile-inactive.html
          git rm .github/workflows/sync-inactive-profile.yml
          git commit -m 'Sync inactive profile with verified 15-service dataset'
          git push
