<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Создать компанию — Отзыв.com</title><style>:root{font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#101828;background:#f6f8fb}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px}.card{width:min(540px,100%);background:#fff;border:1px solid #e4e7ec;border-radius:20px;padding:30px;box-shadow:0 12px 40px rgba(16,24,40,.08)}.brand{font-weight:900;font-size:23px;margin-bottom:25px}.brand span{color:#667085}h1{margin:0 0 8px}p{color:#667085;line-height:1.5}.field{display:block;margin:17px 0}.field span{display:block;font-size:13px;font-weight:750;margin-bottom:7px}input{width:100%;padding:12px;border:1px solid #d0d5dd;border-radius:10px;font:inherit}.hint{font-size:11px;color:#667085;margin-top:5px}button{width:100%;border:0;border-radius:10px;padding:13px;background:#101828;color:#fff;font:inherit;font-weight:800;cursor:pointer}button:disabled{opacity:.55}.status{min-height:22px;margin-top:15px;font-size:13px}.error{color:#b42318}.ok{color:#027a48}.back{display:inline-block;margin-top:20px;color:#475467;text-decoration:none;font-size:13px}</style></head><body><main class="card"><div class="brand">отзыв<span>.com</span></div><h1>Создать компанию</h1><p>Компания станет отдельной сущностью вашего аккаунта. После создания вы автоматически получаете роль владельца и начинаете оформление профиля.</p><form id="form"><label class="field"><span>Название компании *</span><input id="name" maxlength="200" required></label><label class="field"><span>Адрес профиля (slug) *</span><input id="slug" maxlength="64" pattern="[a-z0-9-]+" placeholder="my-company" required><div class="hint">Только латинские буквы, цифры и дефис. Это основа адреса: my-company.отзыв.com</div></label><div class="field"><span style="display:block;margin-bottom:7px">Дополнительно</span><input id="city" placeholder="Город"><input id="website" type="url" placeholder="Официальный сайт" style="margin-top:8px"><input id="phone" placeholder="Телефон" style="margin-top:8px"><input id="email" type="email" placeholder="Email компании" style="margin-top:8px"></div><button id="submit">Создать компанию</button></form><div id="status" class="status" role="status"></div><a class="back" href="account-home.html">← Вернуться к моим компаниям</a></main><script type="module">import{createClient}from'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.115.0/+esm';const s=createClient('https://rzhlcszqtuhkhfibygnk.supabase.co','sb_publishable_yhqWJ1eWUznBkqKwPogTrw_xCdCbFA-');const f=document.getElementById('form'),b=document.getElementById('submit'),st=document.getElementById('status');const msg=(t,c='')=>{st.textContent=t;st.className='status '+c};const slugify=v=>v.toLowerCase().trim().replace(/[^a-z0-9-]+/g,'-').replace(/^-+|-+$/g,'').slice(0,64);document.getElementById('name').addEventListener('input',e=>{const sl=document.getElementById('slug');if(!sl.dataset.edited)sl.value=slugify(e.target.value)});document.getElementById('slug').addEventListener('input',e=>e.target.dataset.edited='1');const{data:{session}}=await s.auth.getSession();if(!session){location.replace('account-login.html')}f.addEventListener('submit',async e=>{e.preventDefault();const name=document.getElementById('name').value.trim(),slug=slugify(document.getElementById('slug').value),city=document.getElementById('city').value.trim(),website=document.getElementById('website').value.trim(),phone=document.getElementById('phone').value.trim(),email=document.getElementById('email').value.trim();if(!name||!/^[a-z0-9][a-z0-9-]{1,62}[a-z0-9]$/.test(slug)){msg('Проверьте название и адрес профиля.','error');return}b.disabled=true;msg('Создаём компанию…');const{data,error}=await s.rpc('create_my_company',{p_name:name,p_slug:slug,p_website:website||null,p_phone:phone||null,p_city:city||null,p_email:email||null});if(error){msg(error.message==='Company slug is already taken'?'Такой адрес уже занят. Выберите другой.':error.message||'Не удалось создать компанию.','error');b.disabled=false;return}msg('Компания создана. Вы — её владелец. Открываем личный кабинет…','ok');setTimeout(()=>location.replace('account-home.html'),500)});</script></body></html>
